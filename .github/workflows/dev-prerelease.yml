name: Dev Pre-release

on:
  workflow_dispatch:
  push:
    branches:
      - linux-support

concurrency:
  group: lunabox-dev-prerelease
  cancel-in-progress: true

permissions:
  contents: write

env:
  DEV_TAG: dev
  DEV_VERSION: 0.0.0.dev

jobs:
  build-linux:
    name: Linux amd64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libayatana-appindicator3-dev libgtk-3-dev pkg-config
          sudo apt-get install -y libwebkit2gtk-4.1-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Install Wails and nfpm
        shell: bash
        run: |
          set -euo pipefail
          WAILS_CLI_VERSION="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_CLI_VERSION}"
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@latest"
          wails version
          nfpm --version

      - name: Build Linux packages
        shell: bash
        env:
          LUNABOX_BANGUMI_CLIENT_ID: ${{ vars.LUNABOX_BANGUMI_CLIENT_ID }}
          LUNABOX_BANGUMI_CLIENT_SECRET: ${{ secrets.LUNABOX_BANGUMI_CLIENT_SECRET }}
          LUNABOX_HIKARINAGI_CLIENT_ID: ${{ vars.LUNABOX_HIKARINAGI_CLIENT_ID }}
          LUNABOX_HIKARINAGI_CLIENT_SECRET: ${{ secrets.LUNABOX_HIKARINAGI_CLIENT_SECRET }}
          LUNABOX_TOUCHGAL_TOKEN: ${{ secrets.LUNABOX_TOUCHGAL_TOKEN }}
          LUNABOX_UMBRA_CLIENT_ID: ${{ vars.LUNABOX_UMBRA_CLIENT_ID }}
          LUNABOX_UMBRA_REGISTRATION_TOKEN: ${{ secrets.LUNABOX_UMBRA_REGISTRATION_TOKEN }}
        run: |
          set -euo pipefail
          bash ./scripts/build.sh all "${DEV_VERSION}" amd64
          test -f "build/bin/LunaBox-${DEV_VERSION}-linux-amd64-portable.tar.gz"
          test -f "build/bin/LunaBox-${DEV_VERSION}-linux-amd64.deb"
          test -f "build/bin/LunaBox-${DEV_VERSION}-linux-amd64.rpm"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lunabox-dev-linux-amd64
          path: |
            build/bin/LunaBox-${{ env.DEV_VERSION }}-linux-amd64-portable.tar.gz
            build/bin/LunaBox-${{ env.DEV_VERSION }}-linux-amd64.deb
            build/bin/LunaBox-${{ env.DEV_VERSION }}-linux-amd64.rpm
          if-no-files-found: error

  build-windows:
    name: Windows amd64 portable
    runs-on: windows-2025

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails
        shell: pwsh
        run: |
          $Version = (go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2).Trim()
          go install "github.com/wailsapp/wails/v2/cmd/wails@$Version"
          wails version

      - name: Build Windows portable package
        shell: pwsh
        env:
          LUNABOX_BANGUMI_CLIENT_ID: ${{ vars.LUNABOX_BANGUMI_CLIENT_ID }}
          LUNABOX_BANGUMI_CLIENT_SECRET: ${{ secrets.LUNABOX_BANGUMI_CLIENT_SECRET }}
          LUNABOX_HIKARINAGI_CLIENT_ID: ${{ vars.LUNABOX_HIKARINAGI_CLIENT_ID }}
          LUNABOX_HIKARINAGI_CLIENT_SECRET: ${{ secrets.LUNABOX_HIKARINAGI_CLIENT_SECRET }}
          LUNABOX_TOUCHGAL_TOKEN: ${{ secrets.LUNABOX_TOUCHGAL_TOKEN }}
          LUNABOX_UMBRA_CLIENT_ID: ${{ vars.LUNABOX_UMBRA_CLIENT_ID }}
          LUNABOX_UMBRA_REGISTRATION_TOKEN: ${{ secrets.LUNABOX_UMBRA_REGISTRATION_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          .\scripts\build.bat portable "${env:DEV_VERSION}" amd64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Artifact = "build/bin/LunaBox-${env:DEV_VERSION}-windows-amd64-portable.zip"
          if (!(Test-Path -LiteralPath $Artifact)) {
            Get-ChildItem -Path "build/bin" -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "Build artifact not found: $Artifact"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: lunabox-dev-windows-amd64-portable
          path: build/bin/LunaBox-${{ env.DEV_VERSION }}-windows-amd64-portable.zip
          if-no-files-found: error

  publish-dev-prerelease:
    name: Publish dev pre-release
    runs-on: ubuntu-24.04
    needs:
      - build-linux
      - build-windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish fixed dev pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          gh release delete "${DEV_TAG}" --yes --cleanup-tag || true
          git tag -d "${DEV_TAG}" >/dev/null 2>&1 || true
          git tag -fa "${DEV_TAG}" "${GITHUB_SHA}" -m "LunaBox development pre-release"
          git push origin "refs/tags/${DEV_TAG}" --force

          mapfile -t assets < <(find release-assets -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found."
            exit 1
          fi

          {
            echo "Automated development pre-release."
            echo
            echo "- Fixed tag: \`${DEV_TAG}\`"
            echo "- Source branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } > release-notes.md

          gh release create "${DEV_TAG}" "${assets[@]}" \
            --title "LunaBox dev" \
            --notes-file release-notes.md \
            --prerelease \
            --latest=false \
            --target "${GITHUB_SHA}"
