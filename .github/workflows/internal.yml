name: Internal Checks

on:
  push:
    branches: [main, master, develop]
    paths:
      - "apps/desktop/internal/**"
      - "apps/desktop/cmd/**"
      - "apps/desktop/build/**"
      - "apps/desktop/scripts/**"
      - "apps/desktop/*.go"
      - "apps/desktop/go.mod"
      - "apps/desktop/go.sum"
      - "apps/desktop/Taskfile.yml"
      - "packages/updater/**"
      - ".github/workflows/internal.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "apps/desktop/internal/**"
      - "apps/desktop/cmd/**"
      - "apps/desktop/build/**"
      - "apps/desktop/scripts/**"
      - "apps/desktop/*.go"
      - "apps/desktop/go.mod"
      - "apps/desktop/go.sum"
      - "apps/desktop/Taskfile.yml"
      - "packages/updater/**"
      - ".github/workflows/internal.yml"

jobs:
  compile:
    name: Compile Internal Packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-15
          - ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: |
            apps/desktop/go.sum
            packages/updater/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/frontend/pnpm-lock.yaml

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libayatana-appindicator3-dev libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: Install matching Wails v3 CLI
        shell: bash
        run: |
          set -euo pipefail
          version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$version"
          test "$(wails3 version 2>&1)" = "$version"

      - name: Patch Wails Linux tray support
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/patch-wails-linux-tray.sh

      - name: Configure macOS compilation
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo 'CGO_ENABLED=1' >> "$GITHUB_ENV"
          echo 'CGO_CFLAGS=-mmacosx-version-min=12.0' >> "$GITHUB_ENV"
          echo 'CGO_LDFLAGS=-mmacosx-version-min=12.0' >> "$GITHUB_ENV"
          echo 'MACOSX_DEPLOYMENT_TARGET=12.0' >> "$GITHUB_ENV"

      - name: Compile platform-specific Go tests
        run: go test -run '^$' ./internal/...

      - name: Install frontend dependencies
        working-directory: apps/desktop/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        working-directory: apps/desktop/frontend
        run: pnpm run build

      - name: Build application with Wails v3
        run: wails3 build
