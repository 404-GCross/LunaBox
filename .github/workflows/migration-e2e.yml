name: Migration E2E

on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/backend/migrations/**'
      - 'packages/backend/go.mod'
      - 'packages/backend/go.sum'
      - 'packages/updater/**'
      - '.github/workflows/migration-e2e.yml'
  pull_request:
    paths:
      - 'packages/backend/migrations/**'
      - 'packages/backend/go.mod'
      - 'packages/backend/go.sum'
      - 'packages/updater/**'
      - '.github/workflows/migration-e2e.yml'

permissions:
  contents: read

concurrency:
  group: migration-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-e2e:
    name: Init through latest migration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/backend/go.mod
          cache: true
          cache-dependency-path: |
            packages/backend/go.sum
            packages/updater/go.sum

      - name: Run migration E2E test
        working-directory: packages/backend
        run: go test ./migrations -run '^TestMigrationsFromInitToLatest$' -count=1 -v
