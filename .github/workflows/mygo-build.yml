name: MyGo Build

on:
  workflow_dispatch:

concurrency:
  group: lunabox-mygo-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version info
        id: version
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo 'v0.0.0')"
          base_version="${latest_tag#v}"
          commit="${GITHUB_SHA:0:7}"
          commit_count="$(git rev-list --count HEAD)"
          version="${base_version}-dev.${commit_count}+${commit}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

  build-windows:
    name: Windows ${{ matrix.arch }} / portable
    needs: version
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apps/desktop-mygo
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            toolchain: mingw-w64-clang-aarch64-toolchain

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop-mygo/go.mod
          cache: true
          cache-dependency-path: |
            apps/desktop-mygo/go.sum
            apps/desktop/go.sum
            packages/backend/go.sum
            packages/updater/go.sum

      - name: Setup ARM64 CGO toolchain
        id: msys2-arm64
        if: matrix.arch == 'arm64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          install: ${{ matrix.toolchain }}

      # tools/release 在 MSYS2_LOCATION/clangarm64/bin 下找 clang。
      - name: Export ARM64 MSYS2 location
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $Location = '${{ steps.msys2-arm64.outputs.msys2-location }}'
          if ([string]::IsNullOrWhiteSpace($Location)) {
            throw 'MSYS2 location output is empty.'
          }
          "MSYS2_LOCATION=$Location" >> $env:GITHUB_ENV

      - name: Build portable package
        shell: pwsh
        env:
          LUNABOX_BANGUMI_CLIENT_ID: ${{ vars.LUNABOX_BANGUMI_CLIENT_ID }}
          LUNABOX_BANGUMI_CLIENT_SECRET: ${{ secrets.LUNABOX_BANGUMI_CLIENT_SECRET }}
          LUNABOX_HIKARINAGI_CLIENT_ID: ${{ vars.LUNABOX_HIKARINAGI_CLIENT_ID }}
          LUNABOX_KUNGAL_CLIENT_ID: ${{ vars.LUNABOX_KUNGAL_CLIENT_ID }}
          LUNABOX_TOUCHGAL_TOKEN: ${{ secrets.LUNABOX_TOUCHGAL_TOKEN }}
          LUNABOX_UMBRA_CLIENT_ID: ${{ vars.LUNABOX_UMBRA_CLIENT_ID }}
          LUNABOX_UMBRA_REGISTRATION_TOKEN: ${{ secrets.LUNABOX_UMBRA_REGISTRATION_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          go run ./tools/release -version '${{ needs.version.outputs.version }}' -arch '${{ matrix.arch }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Artifact = 'build/release/LunaBox-mygo-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable.zip'
          if (!(Test-Path -LiteralPath $Artifact)) {
            throw "Portable artifact not found: $Artifact"
          }

          $ExtractDir = Join-Path $env:RUNNER_TEMP 'lunabox-mygo-portable-check'
          if (Test-Path -LiteralPath $ExtractDir) {
            Remove-Item -LiteralPath $ExtractDir -Recurse -Force
          }
          Expand-Archive -LiteralPath $Artifact -DestinationPath $ExtractDir -Force
          $Required = @('LunaBox.exe', 'lunacli.exe', '7z.exe', '7z.dll')
          if ('${{ matrix.arch }}' -eq 'arm64') {
            $Required += 'duckdb.dll'
          }
          foreach ($Name in $Required) {
            if (!(Get-ChildItem -Path $ExtractDir -Filter $Name -Recurse -File | Select-Object -First 1)) {
              throw "Portable artifact is missing $Name."
            }
          }

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: lunabox-mygo-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable
          path: apps/desktop-mygo/build/release/LunaBox-mygo-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable.zip
          if-no-files-found: error

  build-linux:
    name: Linux ${{ matrix.arch }} / portable
    needs: version
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apps/desktop-mygo
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop-mygo/go.mod
          cache: true
          cache-dependency-path: |
            apps/desktop-mygo/go.sum
            apps/desktop/go.sum
            packages/backend/go.sum
            packages/updater/go.sum

      # MyGo 运行时才用 purego 加载 GTK，构建只需要 DuckDB 的 cgo 编译器。
      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build portable package
        shell: bash
        env:
          LUNABOX_BANGUMI_CLIENT_ID: ${{ vars.LUNABOX_BANGUMI_CLIENT_ID }}
          LUNABOX_BANGUMI_CLIENT_SECRET: ${{ secrets.LUNABOX_BANGUMI_CLIENT_SECRET }}
          LUNABOX_HIKARINAGI_CLIENT_ID: ${{ vars.LUNABOX_HIKARINAGI_CLIENT_ID }}
          LUNABOX_KUNGAL_CLIENT_ID: ${{ vars.LUNABOX_KUNGAL_CLIENT_ID }}
          LUNABOX_TOUCHGAL_TOKEN: ${{ secrets.LUNABOX_TOUCHGAL_TOKEN }}
          LUNABOX_UMBRA_CLIENT_ID: ${{ vars.LUNABOX_UMBRA_CLIENT_ID }}
          LUNABOX_UMBRA_REGISTRATION_TOKEN: ${{ secrets.LUNABOX_UMBRA_REGISTRATION_TOKEN }}
        run: |
          set -euo pipefail
          go run ./tools/release -version '${{ needs.version.outputs.version }}' -arch '${{ matrix.arch }}'

          artifact='build/release/LunaBox-mygo-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}-portable.tar.gz'
          test -f "$artifact"

          extract_dir="${RUNNER_TEMP}/lunabox-mygo-portable-check"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          tar -xzf "$artifact" -C "$extract_dir"
          for name in LunaBox lunacli 7zz; do
            file="$(find "$extract_dir" -type f -name "$name" | head -n 1)"
            if [[ -z "$file" ]]; then
              echo "Portable artifact is missing $name." >&2
              exit 1
            fi
            if [[ ! -x "$file" ]]; then
              echo "$name in the portable artifact is not executable." >&2
              exit 1
            fi
          done

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: lunabox-mygo-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}-portable
          path: apps/desktop-mygo/build/release/LunaBox-mygo-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}-portable.tar.gz
          if-no-files-found: error
