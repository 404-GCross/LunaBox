name: MyGo Build Pre-release

on:
  workflow_dispatch:

concurrency:
  group: lunabox-mygo-dev-prerelease
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      base-version: ${{ steps.version.outputs.base-version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version info
        id: version
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo 'v0.0.0')"
          base_version="${latest_tag#v}"
          commit="${GITHUB_SHA:0:7}"
          commit_count="$(git rev-list --count HEAD)"
          version="${base_version}-dev.${commit_count}+${commit}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base-version=$base_version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

  build-windows:
    name: Windows ${{ matrix.arch }} / portable
    needs: version
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apps/desktop-mygo
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            toolchain: mingw-w64-clang-aarch64-toolchain

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop-mygo/go.mod
          cache: true
          cache-dependency-path: |
            apps/desktop-mygo/go.sum
            apps/desktop/go.sum
            packages/backend/go.sum
            packages/updater/go.sum

      - name: Setup ARM64 CGO toolchain
        id: msys2-arm64
        if: matrix.arch == 'arm64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          install: ${{ matrix.toolchain }}

      # tools/release 在 MSYS2_LOCATION/clangarm64/bin 下找 clang。
      - name: Export ARM64 MSYS2 location
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $Location = '${{ steps.msys2-arm64.outputs.msys2-location }}'
          if ([string]::IsNullOrWhiteSpace($Location)) {
            throw 'MSYS2 location output is empty.'
          }
          "MSYS2_LOCATION=$Location" >> $env:GITHUB_ENV

      - name: Build portable package
        shell: pwsh
        env:
          LUNABOX_BANGUMI_CLIENT_ID: ${{ vars.LUNABOX_BANGUMI_CLIENT_ID }}
          LUNABOX_BANGUMI_CLIENT_SECRET: ${{ secrets.LUNABOX_BANGUMI_CLIENT_SECRET }}
          LUNABOX_HIKARINAGI_CLIENT_ID: ${{ vars.LUNABOX_HIKARINAGI_CLIENT_ID }}
          LUNABOX_KUNGAL_CLIENT_ID: ${{ vars.LUNABOX_KUNGAL_CLIENT_ID }}
          LUNABOX_TOUCHGAL_TOKEN: ${{ secrets.LUNABOX_TOUCHGAL_TOKEN }}
          LUNABOX_UMBRA_CLIENT_ID: ${{ vars.LUNABOX_UMBRA_CLIENT_ID }}
          LUNABOX_UMBRA_REGISTRATION_TOKEN: ${{ secrets.LUNABOX_UMBRA_REGISTRATION_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          go run ./tools/release -version '${{ needs.version.outputs.version }}' -arch '${{ matrix.arch }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Artifact = 'build/release/LunaBox-mygo-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable.zip'
          if (!(Test-Path -LiteralPath $Artifact)) {
            throw "Portable artifact not found: $Artifact"
          }

          $ExtractDir = Join-Path $env:RUNNER_TEMP 'lunabox-mygo-portable-check'
          if (Test-Path -LiteralPath $ExtractDir) {
            Remove-Item -LiteralPath $ExtractDir -Recurse -Force
          }
          Expand-Archive -LiteralPath $Artifact -DestinationPath $ExtractDir -Force
          $Required = @('LunaBox.exe', 'lunacli.exe', '7z.exe', '7z.dll')
          if ('${{ matrix.arch }}' -eq 'arm64') {
            $Required += 'duckdb.dll'
          }
          foreach ($Name in $Required) {
            if (!(Get-ChildItem -Path $ExtractDir -Filter $Name -Recurse -File | Select-Object -First 1)) {
              throw "Portable artifact is missing $Name."
            }
          }

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: lunabox-mygo-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable
          path: apps/desktop-mygo/build/release/LunaBox-mygo-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable.zip
          if-no-files-found: error

  build-linux:
    name: Linux ${{ matrix.arch }} / AppImage
    needs: version
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apps/desktop-mygo
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop-mygo/go.mod
          cache: true
          cache-dependency-path: |
            apps/desktop-mygo/go.sum
            apps/desktop/go.sum
            packages/backend/go.sum
            packages/updater/go.sum

      # MyGo 运行时才用 purego 加载 GTK，构建只需要 DuckDB 的 cgo 编译器；
      # desktop-file-utils 让 appimagetool 校验桌面入口。
      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential desktop-file-utils

      - name: Install appimagetool
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.arch }}' in
            amd64) appimage_arch='x86_64' ;;
            arm64) appimage_arch='aarch64' ;;
            *) echo 'Unsupported AppImage architecture: ${{ matrix.arch }}' >&2; exit 1 ;;
          esac
          tool_path="${RUNNER_TEMP:-/tmp}/appimagetool-${appimage_arch}.AppImage"
          curl -fsSL \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${appimage_arch}.AppImage" \
            -o "$tool_path"
          chmod 755 "$tool_path"
          sudo install -m 0755 "$tool_path" /usr/local/bin/appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 appimagetool --version

      - name: Build AppImage
        shell: bash
        env:
          LUNABOX_BANGUMI_CLIENT_ID: ${{ vars.LUNABOX_BANGUMI_CLIENT_ID }}
          LUNABOX_BANGUMI_CLIENT_SECRET: ${{ secrets.LUNABOX_BANGUMI_CLIENT_SECRET }}
          LUNABOX_HIKARINAGI_CLIENT_ID: ${{ vars.LUNABOX_HIKARINAGI_CLIENT_ID }}
          LUNABOX_KUNGAL_CLIENT_ID: ${{ vars.LUNABOX_KUNGAL_CLIENT_ID }}
          LUNABOX_TOUCHGAL_TOKEN: ${{ secrets.LUNABOX_TOUCHGAL_TOKEN }}
          LUNABOX_UMBRA_CLIENT_ID: ${{ vars.LUNABOX_UMBRA_CLIENT_ID }}
          LUNABOX_UMBRA_REGISTRATION_TOKEN: ${{ secrets.LUNABOX_UMBRA_REGISTRATION_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          go run ./tools/release -version '${{ needs.version.outputs.version }}' -arch '${{ matrix.arch }}'

          artifact="$PWD/build/release/LunaBox-mygo-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}.AppImage"
          test -x "$artifact"

          extract_dir="${RUNNER_TEMP}/lunabox-mygo-appimage-check"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          (cd "$extract_dir" && env -u APPIMAGE_EXTRACT_AND_RUN "$artifact" --appimage-extract >/dev/null)
          for path in AppRun usr/bin/LunaBox usr/bin/lunacli usr/bin/7zz; do
            if [[ ! -x "$extract_dir/squashfs-root/$path" ]]; then
              echo "AppImage is missing executable $path." >&2
              exit 1
            fi
          done

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: lunabox-mygo-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}
          path: apps/desktop-mygo/build/release/LunaBox-mygo-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  create-prerelease:
    name: Create pre-release
    needs: [version, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lunabox-mygo-*
          path: artifacts
          merge-multiple: true

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -maxdepth 1 -type f \( -name '*.zip' -o -name '*.AppImage' \) -exec cp {} release/ \;
          test "$(find release -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 4
          find release -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Get recent commits
        id: commits
        shell: bash
        run: |
          {
            echo 'messages<<EOF'
            git log --pretty=format:'- %s (%h)' -n 5
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        shell: bash
        run: |
          build_timestamp="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          cat <<'EOF' > release_notes.md
          ## 🚀 LunaBox MyGo Development Build

          **⚠️ 这是一个自动构建的 MyGo 原生前端开发版本，与 Wails 版的开发版（`dev-latest`）分开发布**

          ### 📋 版本信息

          - **版本号**: `${{ needs.version.outputs.version }}`
          - **基于版本**: `${{ needs.version.outputs.base-version }}`
          - **提交**: [`${{ needs.version.outputs.commit }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          - **构建时间**: __BUILD_TIMESTAMP__

          ### 📝 最近提交

          ${{ steps.commits.outputs.messages }}

          ### 📦 下载说明

          | 文件 | 说明 |
          |------|------|
          | `*-windows-*-portable.zip` | Windows 便携版，解压即用，数据存储在程序目录 |
          | `*-linux-*.AppImage` | Linux AppImage，数据存储在 `~/.config/LunaBox`，依赖系统 GTK 3 与 libepoxy 运行库 |

          Windows 与 Linux 均提供 AMD64、ARM64。安装包、代码签名与自动更新尚未支持。

          ### ⚠️ 注意事项

          - 此版本为开发测试版本，界面与功能仍在迁移中，可能存在未知问题
          - Linux AppImage 与 Wails 版的 Linux 安装版、AppImage 共用 `~/.config/LunaBox`，建议测试前做好数据备份
          - 如遇问题，请在 [Issues](https://github.com/${{ github.repository }}/issues) 中反馈
          EOF
          sed -i "s|__BUILD_TIMESTAMP__|$build_timestamp|" release_notes.md
          cat release_notes.md

      - name: Replace rolling pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete mygo-dev-latest --yes || true
          git push origin :refs/tags/mygo-dev-latest || true
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -f mygo-dev-latest
          git push -f origin mygo-dev-latest

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mygo-dev-latest
          name: MyGo 开发版 - ${{ needs.version.outputs.version }}
          files: release/*
          body_path: release_notes.md
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
