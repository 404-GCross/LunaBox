version: "3"

includes:
  desktop:
    taskfile: ./apps/desktop/Taskfile.yml
    dir: ./apps/desktop

tasks:
  updater:test:
    summary: Runs the standalone updater tests
    dir: packages/updater
    cmds:
      - go test ./...

  update-server:install:
    summary: Installs update server dependencies
    dir: apps/update-server
    cmds:
      - pnpm install

  update-server:dev:
    summary: Runs the update server admin dev server
    dir: apps/update-server
    cmds:
      - pnpm dev

  update-server:check:
    summary: Typechecks and tests the update server
    dir: apps/update-server
    cmds:
      - pnpm typecheck
      - pnpm test
