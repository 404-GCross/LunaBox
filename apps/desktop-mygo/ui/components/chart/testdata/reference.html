<!doctype html>
<!--
  用原版的 Chart.js（apps/desktop/frontend/node_modules）与原版组件的选项，画 TestScreenshotDump 写出的
  chart-data.js 里的同一份数据，作为对照。用法（Git Bash，150% 缩放，dark=0 为浅色）：

    chrome --headless=new --hide-scrollbars --force-device-scale-factor=1.5 --window-size=<W+40>,<H+40> \
      --screenshot=<输出.png> "file:///<本文件>?data=file:///<目录>/chart-data.js&case=<场景>&dark=1"

  场景：折线图的 lineCases 名称，以及 hourweek、tags、heatmap。
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; font-family: system-ui; line-height: 1.5; }
  .card { padding: 20px; box-sizing: border-box; min-height: 100vh; }
  .dark .card { background: #1c1e1f; }
  .light .card { background: #ffffff; }
  ::-webkit-scrollbar { width: 9px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background-color: var(--thumb); background-clip: content-box; border-left: 3px solid transparent; border-radius: 6px; }
  .light { --thumb: #ccc; }
  .dark { --thumb: #4b5563; }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
const q = new URLSearchParams(location.search);
const dark = q.get("dark") === "1";
document.body.className = dark ? "dark" : "light";
const base = "../../../../../desktop/frontend/node_modules/";
function load(src) {
  return new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = fail;
    document.head.appendChild(s);
  });
}
// utils/time.ts（zh-CN）
function formatDuration(seconds) {
  const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60), s = seconds % 60;
  if (h > 0 && m > 0) return `${h}小时${m}分钟`;
  if (h > 0) return `${h}小时`;
  if (m > 0) return `${m}分钟`;
  return `${s}秒`;
}
function formatDurationChart(seconds) {
  const total = Math.floor(Math.max(0, seconds) / 60);
  const h = Math.floor(total / 60);
  return h > 0 ? `${h}时 ${total % 60}分` : `${total}分`;
}
const textColor = dark ? "#e5e7eb" : "#374151";
const gridColor = dark ? "#374151" : "#e5e7eb";

function lineChart(lc) {
  const card = document.getElementById("card");
  const wrapper = document.createElement("div");
  wrapper.style.width = lc.W + "px"; wrapper.style.height = lc.H + "px";
  card.appendChild(wrapper);
  const n = lc.scaleType === "time" ? lc.times.length : lc.labels.length;
  const minChartWidth = n > 1 ? n * lc.minPointWidth : 0;
  const scrollable = minChartWidth > lc.W;
  const scroller = document.createElement("div");
  scroller.style.cssText = `height:100%;width:100%;overflow-y:hidden;overflow-x:${scrollable ? "auto" : "hidden"}`;
  wrapper.appendChild(scroller);
  const inner = document.createElement("div");
  inner.style.cssText = `position:relative;height:100%;min-width:100%;width:${Math.max(lc.W, minChartWidth)}px`;
  scroller.appendChild(inner);
  const canvas = document.createElement("canvas");
  inner.appendChild(canvas);
  const datasets = lc.series.map(s => {
    const d = {
      label: s.label,
      borderColor: s.color,
      backgroundColor: s.color.replace("rgb", "rgba").replace(")", ", 0.5)"),
      tension: lc.tension,
    };
    if (lc.scaleType === "time") {
      d.data = lc.times.map((x, i) => ({ x, y: s.data[i] }));
      d.parsing = false; d.showLine = true;
      d.pointRadius = lc.pointRadius[0]; d.pointHoverRadius = lc.pointRadius[1];
    } else {
      d.data = s.data;
    }
    return d;
  });
  const data = lc.scaleType === "time" ? { datasets } : { labels: lc.labels, datasets };
  const xTicks = { autoSkip: true, autoSkipPadding: 12, color: textColor, maxRotation: 45, minRotation: 0 };
  const options = {
    animation: false,
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: "index", intersect: false },
    plugins: {
      legend: { display: lc.showLegend, position: "top", labels: { color: textColor } },
      title: { display: false },
      tooltip: { callbacks: { label: (ctx) => (ctx.dataset.label ? `${ctx.dataset.label}: ` : "") + formatDuration(Number(ctx.parsed.y || 0)) } },
    },
    scales: {
      x: lc.scaleType === "time"
        ? { type: "time", min: lc.min, max: lc.max, time: { minUnit: "day", tooltipFormat: "yyyy-MM-dd", displayFormats: { day: "yyyy-MM-dd", month: "yyyy-MM", year: "yyyy" } }, grid: { color: gridColor }, ticks: xTicks }
        : { type: "category", bounds: "ticks", grid: { color: gridColor }, ticks: xTicks },
      y: {
        beginAtZero: true, max: lc.hasPlayData ? undefined : 600,
        title: { display: !!lc.yAxisTitle, text: lc.yAxisTitle, color: textColor },
        grid: { color: gridColor },
        ticks: { color: textColor, stepSize: lc.hasPlayData ? undefined : 60, callback: v => formatDurationChart(Number(v)) },
      },
    },
  };
  const chart = new Chart(canvas, { type: "line", data, options });
  // 布局数值，供 --dump-dom 读取后与 layoutLine 对照
  const x = chart.scales.x, y = chart.scales.y;
  document.body.dataset.layout = JSON.stringify({ area: chart.chartArea, rotation: x.labelRotation, yWidth: y.width,
    xHeight: x.height, ticks: x.ticks.map(t => t.label), yTicks: y.ticks.map(t => t.value), padR: x.paddingRight, padL: x.paddingLeft, minPadding: chart._minPadding });
  if (lc.Scroll) scroller.scrollLeft = lc.Scroll;
  if (lc.Hover >= 0) {
    const active = datasets.map((_, i) => ({ datasetIndex: i, index: lc.Hover }));
    chart.setActiveElements(active);
    chart.tooltip.setActiveElements(active, { x: 0, y: 0 });
    chart.update();
  }
}

function hourWeek(D) {
  const card = document.getElementById("card");
  card.style.width = "440px";
  const hourly = D.hourly, weekday = D.weekday;
  let peakHour = -1, hourMax = 0;
  for (const h of hourly) if (h.duration > hourMax) { hourMax = h.duration; peakHour = h.hour; }
  let peakWeekday = -1, weekdayMax = 0;
  for (const w of weekday) if (w.duration > weekdayMax) { weekdayMax = w.duration; peakWeekday = w.weekday; }
  const labels = ["日", "一", "二", "三", "四", "五", "六"];
  const barFill = dark ? "#34d399" : "#10b981", barFillPeak = dark ? "#fbbf24" : "#f59e0b";
  const muted = dark ? "#9ca3af" : "#6b7280", strong = dark ? "#d1d5db" : "#4b5563";
  card.innerHTML = `<div style="display:flex;flex-direction:column;gap:16px">
    <div><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <span style="font-size:12px;line-height:16px;color:${muted}">时段（24h）</span>
      <span style="font-size:12px;line-height:16px;color:${strong}">高峰 ${String(peakHour).padStart(2, "0")}:00 · ${formatDuration(hourMax)}</span></div>
      <div style="height:112px"><canvas id="h"></canvas></div></div>
    <div><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <span style="font-size:12px;line-height:16px;color:${muted}">星期分布</span>
      <span style="font-size:12px;line-height:16px;color:${strong}">高峰 ${labels[peakWeekday]} · ${formatDuration(weekdayMax)}</span></div>
      <div style="height:176px"><canvas id="w"></canvas></div></div></div>`;
  const hc = new Chart(document.getElementById("h"), {
    type: "bar",
    data: { labels: Array.from({ length: 24 }, (_, i) => String(i)), datasets: [{ data: hourly.map(h => h.duration), backgroundColor: hourly.map(h => h.hour === peakHour && h.duration > 0 ? barFillPeak : barFill), borderRadius: 2, maxBarThickness: 18 }] },
    options: { animation: false, responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { title: items => `${String(items[0]?.label ?? "").padStart(2, "0")}:00`, label: ctx => { const v = Number(ctx.parsed.y || 0); return v > 0 ? formatDuration(v) : "未游玩"; } } } },
      scales: { x: { grid: { display: false }, ticks: { color: textColor, autoSkip: false, callback: (_v, idx) => [0, 6, 12, 18, 23].includes(idx) ? String(idx) : "" } },
        y: { beginAtZero: true, grid: { color: gridColor }, ticks: { color: textColor, maxTicksLimit: 4, callback: v => formatDurationChart(Number(v)) } } } },
  });
  new Chart(document.getElementById("w"), {
    type: "bar",
    data: { labels: weekday.map(w => labels[w.weekday]), datasets: [{ data: weekday.map(w => w.duration), backgroundColor: weekday.map(w => w.weekday === peakWeekday && w.duration > 0 ? barFillPeak : barFill), borderRadius: 2, barThickness: 14 }] },
    options: { indexAxis: "y", animation: false, responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => { const v = Number(ctx.parsed.x || 0); return v > 0 ? formatDuration(v) : "未游玩"; } } } },
      scales: { x: { beginAtZero: true, grid: { color: gridColor }, ticks: { color: textColor, maxTicksLimit: 4, callback: v => formatDurationChart(Number(v)) } },
        y: { grid: { display: false }, ticks: { color: textColor } } } },
  });
  const active = [{ datasetIndex: 0, index: 21 }];
  hc.setActiveElements(active); hc.tooltip.setActiveElements(active, { x: 0, y: 0 }); hc.update();
}

const TAG_COLORS = ["#f97316", "#ef4444", "#ec4899", "#a855f7", "#6366f1", "#3b82f6", "#06b6d4", "#10b981", "#84cc16", "#eab308"];
function tags(D) {
  const card = document.getElementById("card");
  card.style.width = "500px";
  const total = D.tags.reduce((s, t) => s + t.total_duration, 0);
  const muted = dark ? "#9ca3af" : "#6b7280", strong = dark ? "#ffffff" : "#121416", track = dark ? "#44484e" : "#f3f4f6";
  card.innerHTML = `<div style="display:flex;flex-direction:column;gap:20px">
    <div style="display:flex;justify-content:center"><div style="position:relative;width:200px;aspect-ratio:1/1;max-width:100%"><canvas id="p"></canvas></div></div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px;row-gap:8px">
    ${D.tags.map((t, i) => { const pct = total ? t.total_duration / total * 100 : 0; return `<div style="display:flex;align-items:center;gap:12px">
      <span style="width:24px;font-size:12px;line-height:16px;color:${muted};font-weight:500;font-variant-numeric:tabular-nums;text-align:right;flex-shrink:0">#${i + 1}</span>
      <div style="flex:1;min-width:0"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px">
        <span style="font-size:14px;line-height:20px;font-weight:500;color:${strong};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.name}</span>
        <span style="font-size:12px;line-height:16px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono','Courier New',monospace;color:${muted};flex-shrink:0;white-space:nowrap">${pct.toFixed(1)}%</span></div>
        <div style="height:6px;border-radius:9999px;background:${track};overflow:hidden"><div style="height:100%;border-radius:9999px;width:${Math.max(2, pct)}%;background:${TAG_COLORS[i % 10]}"></div></div></div></div>`; }).join("")}
    </div></div>`;
  const pc = new Chart(document.getElementById("p"), {
    type: "pie",
    data: { labels: D.tags.map(t => t.name), datasets: [{ data: D.tags.map(t => t.total_duration), backgroundColor: D.tags.map((_, i) => TAG_COLORS[i % 10]), borderColor: dark ? "#1f2937" : "#ffffff", borderWidth: 2 }] },
    options: { animation: false, responsive: true, maintainAspectRatio: false, layout: { padding: 0 },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => { const v = Number(ctx.parsed || 0); return `${ctx.label}: ${formatDuration(v)} (${(v / total * 100).toFixed(1)}%)`; } } } } },
  });
  const box = document.getElementById("p").parentElement;
  document.body.dataset.layout = JSON.stringify({ container: [box.clientWidth, box.clientHeight], chart: [pc.width, pc.height], area: pc.chartArea });
  const active = [{ datasetIndex: 0, index: 1 }];
  pc.setActiveElements(active); pc.tooltip.setActiveElements(active, { x: 0, y: 0 }); pc.update();
}

function heatmap(D) {
  const card = document.getElementById("card");
  const containerWidth = 720;
  card.style.width = containerWidth + 40 + "px";
  const parse = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso); return new Date(+m[1], m[2] - 1, +m[3]); };
  const valid = D.heatmap.map(c => ({ date: parse(c.date), iso: c.date, duration: c.duration })).sort((a, b) => a.date - b.date);
  const first = valid[0].date, last = valid[valid.length - 1].date;
  const gridStart = new Date(first); gridStart.setDate(first.getDate() - first.getDay());
  const gridEnd = new Date(last); gridEnd.setDate(last.getDate() + (6 - last.getDay()));
  const map = new Map(valid.map(v => [v.iso, v.duration]));
  const all = [];
  for (const cur = new Date(gridStart); cur <= gridEnd; cur.setDate(cur.getDate() + 1)) {
    const iso = `${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, "0")}-${String(cur.getDate()).padStart(2, "0")}`;
    all.push({ date: new Date(cur), iso, duration: map.get(iso) ?? 0, ph: cur < first || cur > last });
  }
  const cols = []; for (let i = 0; i < all.length; i += 7) cols.push(all.slice(i, i + 7));
  const months = []; let lastMonth = -1; const fmt = new Intl.DateTimeFormat("zh-CN", { month: "short" });
  cols.forEach((col, idx) => { const f = col.find(c => !c.ph); if (!f) return; const m = f.date.getMonth(); if (m !== lastMonth) { months.push({ col: idx, label: fmt.format(f.date) }); lastMonth = m; } });
  const active = all.filter(c => !c.ph && c.duration > 0).length;
  const inner = Math.max(0, containerWidth - 26);
  let size = Math.floor(inner / cols.length / 1.25); size = Math.max(6, Math.min(14, size));
  let gap = Math.max(2, Math.round(size / 4));
  const fits = (s, g) => cols.length * s + (cols.length - 1) * g <= inner;
  while (!fits(size, gap) && gap > 1) gap--; while (!fits(size, gap) && size > 6) size--;
  const gridWidth = cols.length * size + (cols.length - 1) * gap, step = size + gap;
  const ds = D.heatmap.map(c => c.duration).filter(d => d > 0).sort((a, b) => a - b);
  const p50 = ds[Math.floor(ds.length * 0.5)], p90 = ds[Math.min(ds.length - 1, Math.floor(ds.length * 0.9))];
  const bucket = d => d <= 0 ? 0 : d < Math.max(60, p50 * 0.4) ? 1 : d < p50 ? 2 : d < p90 ? 3 : 4;
  const scale = dark ? ["rgba(255,255,255,0.06)", "#0f3a2e", "#14563f", "#1f8a5c", "#34d399"] : ["rgba(15,23,42,0.06)", "#bbf7d0", "#86efac", "#34d399", "#059669"];
  const muted = dark ? "#9ca3af" : "#6b7280";
  const wk = ["日", "一", "二", "三", "四", "五", "六"];
  card.innerHTML = `<div style="width:${containerWidth}px"><div style="margin:0 auto;width:${26 + gridWidth}px">
    <div style="margin-bottom:4px;display:flex;align-items:baseline;justify-content:space-between;font-size:11px;color:${dark ? "rgba(255,255,255,.7)" : "#4b5563"}"><span style="font-weight:500;color:${dark ? "rgba(255,255,255,.85)" : "#44484e"}">过去一年活跃 ${active} 天</span></div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="display:flex;height:12px"><div style="width:26px;flex-shrink:0"></div><div style="position:relative;width:${gridWidth}px">
        ${months.map((m, i) => { const right = i === months.length - 1 && cols.length - m.col <= 3; return `<span style="position:absolute;white-space:nowrap;font-size:10px;line-height:1;color:${muted};${right ? "right:0" : `left:${m.col * step}px`}">${m.label}</span>`; }).join("")}
      </div></div>
      <div style="display:flex"><div style="display:flex;flex-shrink:0;flex-direction:column;gap:${gap}px;width:22px;margin-right:4px">
        ${wk.map((w, i) => `<span style="padding-right:4px;text-align:right;font-size:10px;color:${muted};height:${size}px;line-height:${size}px;visibility:${i % 2 ? "visible" : "hidden"}">${w}</span>`).join("")}</div>
        <div style="display:flex;gap:${gap}px;width:${gridWidth}px">${cols.map(col => `<div style="display:flex;flex-direction:column;gap:${gap}px;width:${size}px;flex-shrink:0">${col.map(c => c.ph ? `<div style="width:${size}px;height:${size}px"></div>` : `<div style="border-radius:2px;width:${size}px;height:${size}px;background:${scale[bucket(c.duration)]}"></div>`).join("")}</div>`).join("")}</div></div>
      <div style="display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:10px;color:${muted}"><span>少</span>${scale.map(c => `<span style="border-radius:2px;width:${size}px;height:${size}px;background:${c}"></span>`).join("")}<span>多</span></div>
    </div></div></div>`;
}

(async () => {
  await load(base + "chart.js/dist/chart.umd.js");
  await load(base + "chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.js");
  await load(q.get("data"));
  const name = q.get("case");
  if (name === "hourweek") hourWeek(DATA);
  else if (name === "tags") tags(DATA);
  else if (name === "heatmap") heatmap(DATA);
  else lineChart(DATA.line.find(l => l.Name === name));
})();
</script>
</body>
</html>
