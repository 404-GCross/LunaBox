name: "lunabox"
arch: "${GOARCH}"
platform: "linux"
version: "${VERSION}"
section: "utils"
priority: "optional"
maintainer: "${MAINTAINER}"
description: "LunaBox game library manager"
vendor: "LunaBox"
homepage: "https://github.com/Saramanda9988/LunaBox"
license: "MIT"
release: "1"

contents:
  - src: "./build/bin/LunaBox"
    dst: "/usr/bin/LunaBox"
  - src: "./build/bin/lunacli"
    dst: "/usr/bin/lunacli"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/LunaBox.png"
  - src: "./build/linux/desktop"
    dst: "/usr/share/applications/LunaBox.desktop"

depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0
  - xdg-utils

overrides:
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
      - xdg-utils
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1
      - xdg-utils

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  postremove: "./build/linux/nfpm/scripts/postremove.sh"
